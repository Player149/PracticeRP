<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>8 BILLION</title><style>body{margin:0;background:#10121b;color:white;font-family:system-ui;overflow:hidden}canvas{width:100vw;height:100vh;display:block;touch-action:none}#ui{position:fixed;top:10px;left:12px;text-shadow:1px 2px 4px #000}#buttons{position:fixed;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between}button{background:#222b42c9;color:white;border:1px solid #9298a6;border-radius:12px;padding:17px;touch-action:none}</style><canvas id="c"></canvas><div id="ui"></div><div id="buttons"><div><button data-k="a">◀</button><button data-k="d">▶</button><button data-k="w">점프</button></div><div><button data-k="e">출입</button><button data-k="l">대시</button><button data-k="j">공격</button><button data-k="k">강공격</button></div></div><script>
const c=document.querySelector('#c'),g=c.getContext('2d'),ui=document.querySelector('#ui');let W,H,G,cam=0,inside=null,keys={},press={},people=[],bullets=[],fx=[],houses=[],kills=0,souls=0,player,shake=0,t=0;
const R=(a,b)=>a+Math.random()*(b-a),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));function resize(){W=innerWidth;H=innerHeight;G=H*.8;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}onresize=resize;resize();
function spawn(x,type){people.push({x,y:G-32,v:R(-60,60),type,hp:type==='civil'?1:3,fire:R(0,3),alive:true})}
function reset(){inside=null;kills=souls=0;houses=[];people=[];bullets=[];fx=[];player={x:70,y:G-52,w:28,h:52,vx:0,vy:0,face:1,hp:100,cool:0,attack:0,dash:0,inv:0};for(let i=0;i<12;i++)houses.push({x:320+i*440,w:235,h:190+(i%3)*28,hp:100,dead:false});for(let i=0;i<145;i++)spawn(R(150,5500),Math.random()<.2?'soldier':Math.random()<.08?'bomber':'civil')}
function burst(x,y,color,n=14){for(let i=0;i<n;i++)fx.push({x,y,vx:R(-200,200),vy:R(-240,80),life:R(.2,.8),color})}
function kill(p){if(!p.alive)return;p.alive=false;kills++;souls++;burst(p.x,p.y,'#d7486a',12)}
function collapse(b){if(b.dead)return;b.dead=true;souls+=Math.floor(R(30000,180000));burst(b.x+b.w/2,G-90,'#ddae8b',65);shake=16;if(inside){inside=null;player.x=b.x+b.w/2;player.y=G-52}}
function strike(power){if(player.cool>0)return;player.cool=power===2?.7:.24;player.attack=.2;shake=power===2?7:3;let range=power===2?160:90;for(const p of people){if(!p.alive||inside)continue;if(Math.abs(p.x-player.x-player.face*range/2)<range/2+15&&Math.abs(p.y-player.y)<90){p.hp-=power===2?4:1;p.v+=player.face*220;if(p.hp<=0)kill(p)}}if(inside){inside.hp-=power===2?20:8;burst(player.x+60,player.y,'#e7a56d');if(inside.hp<=0)collapse(inside)}else for(const b of houses)if(!b.dead&&player.x+player.face*range>b.x&&player.x+player.face*range<b.x+b.w){b.hp-=power===2?15:5;burst(b.x,G-70,'#c5a58e');if(b.hp<=0)collapse(b)}}
function interact(){if(inside){player.x=inside.x+inside.w/2;inside=null;return}let b=houses.find(b=>!b.dead&&Math.abs(player.x-(b.x+b.w/2))<b.w/2);if(b){inside=b;player.x=80;player.y=G-52}}
onkeydown=e=>{let k=e.key.toLowerCase();if(k===' ')k='w';if(k==='arrowleft')k='a';if(k==='arrowright')k='d';if(!keys[k])press[k]=true;keys[k]=true};onkeyup=e=>{let k=e.key.toLowerCase();if(k===' ')k='w';if(k==='arrowleft')k='a';if(k==='arrowright')k='d';keys[k]=false};document.querySelectorAll('button').forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);if(!keys[k])press[k]=true;keys[k]=true};b.onpointerup=()=>keys[k]=false;b.onpointercancel=()=>keys[k]=false});
function tick(dt){t+=dt;if(press.r)reset();if(press.e)interact();if(press.j)strike(1);if(press.k)strike(2);if(press.l)player.dash=.16;player.cool=Math.max(0,player.cool-dt);player.attack=Math.max(0,player.attack-dt);player.dash=Math.max(0,player.dash-dt);player.inv=Math.max(0,player.inv-dt);shake=Math.max(0,shake-35*dt);
let dir=(keys.d?1:0)-(keys.a?1:0);if(dir)player.face=dir;player.vx=player.dash>0?player.face*760:dir*270;if(press.w&&player.y>=G-52)player.vy=-560;player.vy+=1450*dt;player.x=clamp(player.x+player.vx*dt,0,inside?W-35:5600);player.y=Math.min(G-52,player.y+player.vy*dt);if(player.y>=G-52)player.vy=0;
if(!inside){for(const p of people){if(!p.alive)continue;let d=player.x-p.x;p.fire-=dt;if(p.type==='civil'){if(Math.abs(d)<420)p.v+=-Math.sign(d)*480*dt;p.v=clamp(p.v*.98,-210,210)}else{p.v+=((Math.abs(d)<170?-Math.sign(d)*95:Math.abs(d)>370?Math.sign(d)*95:0)-p.v)*dt*2;if(Math.abs(d)<580&&p.fire<=0){let dx=player.x-p.x,dy=player.y-p.y,len=Math.hypot(dx,dy)||1;bullets.push({x:p.x,y:p.y+10,vx:dx/len*470,vy:p.type==='bomber'?-360:dy/len*470,bomb:p.type==='bomber',life:2});p.fire=R(1.2,3.5)}}p.x=clamp(p.x+p.v*dt,0,5600)}
for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.bomb)b.vy+=950*dt;if((b.bomb&&b.y>=G-5)||Math.hypot(b.x-player.x,b.y-player.y-20)<24){if(player.inv<=0&&player.dash<=0){player.hp-=b.bomb?16:5;player.inv=.6;shake=8}if(b.bomb)burst(b.x,b.y,'#ffad58',28);b.life=0}}bullets=bullets.filter(b=>b.life>0);if(player.hp<=0)reset();cam=clamp(player.x-W*.38,0,5600-W)}
for(const p of fx){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=350*dt;p.life-=dt}fx=fx.filter(p=>p.life>0);press={}}
function box(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}
function draw(){g.save();g.translate(R(-shake,shake),R(-shake,shake));box(0,0,W,H,'#191b2c');box(0,G,W,H-G,'#292934');if(!inside){for(let i=0;i<60;i++){let x=i*120-cam*.2;box(x,G-120-(i*31%110),105,240,'#303244')}for(const b of houses){let x=b.x-cam;if(x>W||x+b.w<0)continue;if(b.dead){box(x,G-25,b.w,25,'#60505a');continue}box(x,G-b.h,b.w,b.h,'#525362');for(let i=0;i<4;i++)for(let j=0;j<3;j++)box(x+24+i*49,G-b.h+30+j*48,25,30,'#d3a17a');box(x+b.w/2-17,G-44,34,44,'#222631');box(x,G-b.h-10,b.w*b.hp/100,5,'#f36b74')}for(const p of people){if(!p.alive)continue;let x=p.x-cam;if(x<-30||x>W+30)continue;box(x,p.y,12,10,'#cfb5a7');box(x-2,p.y+10,16,20,p.type==='civil'?'#9c9daa':'#879782');box(x,p.y+30,4,5,'#27232c');box(x+9,p.y+30,4,5,'#27232c');if(p.type!=='civil')box(x+10,p.y+15,18,3,'#171923')}for(const b of bullets)box(b.x-cam,b.y,b.bomb?9:5,5,b.bomb?'#ff9c55':'#ffe1a2')}else{box(30,G-280,W-60,280,'#4b414d');box(W*.62,G-210,130,210,'#73505a');for(let i=0;i<4;i++)box(W*.62+20+i*27,G-170,13,125,'#d96e60');box(W*.62,G-222,130*inside.hp/100,7,'#ff7474')}
for(const f of fx)box(f.x-(inside?0:cam),f.y,5,5,f.color);
let x=player.x-(inside?0:cam),y=player.y;box(x+4,y,20,31,'#090911');box(x+8,y-10,13,14,'#090911');box(x+8,y+30,5,22,'#090911');box(x+21,y+30,5,22,'#090911');box(x+10,y-3,4,3,'#ff5988');if(player.attack>0){g.strokeStyle='#ff5d8b';g.lineWidth=15;g.beginPath();g.arc(x+15,y+20,80,player.face>0?-1.2:2,player.face>0?1:4.3);g.stroke()}g.restore();
box(12,65,204,13,'#313447');box(14,67,200*player.hp/100,9,'#d94672');ui.innerHTML='<b>8 BILLION — PROTOTYPE</b><br>처치 '+kills+' · 수확 영혼 '+souls.toLocaleString()+' · 건물 '+houses.filter(x=>x.dead).length+'/12<br><small>A/D 이동 · W 점프 · J 공격 · K 강공격 · L 대시 · E 건물 출입 · R 재시작</small>'}
let prev=performance.now();function loop(now){let dt=Math.min((now-prev)/1000,.033);prev=now;tick(dt);draw();requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);
</script></html>
